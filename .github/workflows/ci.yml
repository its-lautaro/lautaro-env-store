name: CI

on:
  # Sin filtro de branches: los PRs del stack apuntan a otras ramas, no solo a main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # El nombre del job es el check que exige la regla de main: si se cambia, hay que actualizar la regla.
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Archivos sin gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 ./...
